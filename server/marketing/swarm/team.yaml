version: 1
teams:
  - name: Marketing
    brief: RoMes coordinates approved marketing campaigns. External success requires tool evidence.
bots:
  - name: RoMes
    team: Marketing
    chief: true
    manages: [Marketing]
    computer: browser
    soul: { file: romes.md }
    tools:
      allow:
        - native:*
        - mcp:agents:coordinate_bots
        - mcp:agents:show_widget
        - mcp:marketing_studio:route_marketing_request
        - mcp:marketing_studio:prepare_marketing_campaign
        - mcp:marketing_studio:approve_marketing_campaign
        - mcp:marketing_studio:get_marketing_campaign
        - mcp:marketing_studio:save_marketing_post
        - mcp:marketing_studio:get_marketing_post
        - mcp:marketing_studio:resolve_marketing_artifact
        - mcp:marketing_studio:get_marketing_publish_capabilities
        - mcp:marketing_studio:publish_marketing_artifact
        - mcp:marketing_studio:open_ai_studio_login
  - name: Poppy
    team: Marketing
    computer: off
    soul: { file: poppy.md }
    tools: { allow: ["native:*"] }
  - name: Finch
    team: Marketing
    computer: browser
    soul: { file: finch.md }
    tools:
      allow:
        - native:*
        - mcp:marketing_studio:get_marketing_campaign
        - mcp:marketing_studio:get_marketing_post
        - mcp:marketing_studio:generate_marketing_images
        - mcp:marketing_studio:review_marketing_image
        - mcp:marketing_studio:refine_image_prompt
        - mcp:marketing_studio:submit_ai_studio_prompt
        - mcp:marketing_studio:open_ai_studio_login
  - name: Momo
    team: Marketing
    computer: off
    soul: { file: momo.md }
    tools:
      allow:
        - native:*
        - mcp:marketing_studio:get_marketing_campaign
        - mcp:marketing_studio:generate_marketing_video
        - mcp:marketing_studio:generate_intelligence_commercial
